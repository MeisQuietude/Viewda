[package]
name = "viewda-data-engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Metadata-only examples disable DuckDB so they keep rustup as their sole tool prerequisite.
default = ["query-engine"]
query-engine = ["dep:arrow-select", "dep:duckdb", "dep:tempfile"]

[dependencies]
# TODO(Arrow 59): Upgrade all Arrow and Parquet pins together when duckdb-rs supports it.
# parquet 58 rejects valid nested-list row groups with "Failed to reconstruct list from level
# data", while a Parquet-only bump creates incompatible RecordBatch types at the DuckDB boundary.
arrow-array = "=58.4.0"
arrow-ipc = "=58.4.0"
arrow-schema = "=58.4.0"
arrow-select = { version = "=58.4.0", optional = true }
bytes = "1"
duckdb = { version = "=1.10505.0", optional = true }
parquet = "=58.4.0"
serde.workspace = true
tempfile = { version = "=3.27.0", optional = true }
thiserror.workspace = true
thrift = { version = "=0.17.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
half = "=2.7.1"
serde_json.workspace = true

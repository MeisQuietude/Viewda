[package]
name = "viewda-desktop"
version.workspace = true
authors.workspace = true
description.workspace = true
edition.workspace = true
homepage.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "viewda_desktop"
crate-type = ["lib"]

[[bin]]
name = "viewda"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog = "=2.7.2"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-updater = "=2.10.1"
thiserror.workspace = true
viewda-data-engine = { path = "../data-engine" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "=0.18.2", features = ["v3_24_9"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSWorkspace", "block2", "objc2-uniform-type-identifiers", "std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSBundle", "NSError", "NSObject", "NSProcessInfo", "NSString", "NSURL", "std"] }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["UTType", "std"] }

[dev-dependencies]
arrow-array = "=58.4.0"
arrow-schema = "=58.4.0"
parquet = "=58.4.0"
tempfile = "=3.27.0"

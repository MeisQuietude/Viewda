# Common behavior is verified once on Linux. The native matrix compiles every
# target_os branch and runs Rust tests without paying for release packaging or
# repeating platform-independent frontend checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_CACHE_EPOCH: check-v1

jobs:
  linux:
    name: Linux checks
    runs-on: ubuntu-22.04
    env:
      CARGO_SYSTEM_LAYER: ubuntu-22.04
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          test "$(uname -m)" = x86_64
          scripts/install-tauri-deps.sh

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        working-directory: native

      - name: Restore reusable Cargo outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            native/target/debug/.fingerprint
            native/target/debug/build
            native/target/debug/deps
          key: cargo-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-${{ hashFiles('native/Cargo.lock', 'scripts/install-duckdb.sh', 'native/.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-

      - name: Restore provisioned dependencies
        uses: actions/cache@v6
        with:
          path: |
            native/.toolchain/node
            native/.duckdb
            ~/.npm
          key: provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-${{ hashFiles('native/desktop/package-lock.json') }}
          restore-keys: |
            provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-

      - name: Verify the workspace
        run: scripts/run.sh check

      - name: Check metadata-only examples
        working-directory: native/data-engine
        run: cargo check --no-default-features --examples

  native:
    name: ${{ matrix.name }} native checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-26
            host-architecture: arm64
            platform: macos
            system-layer: macos-26
            provision-suffix: ""
          - name: Windows x64
            runner: windows-2025
            host-architecture: x86_64
            platform: windows
            system-layer: windows-2025
            provision-suffix: -npm-home-v1
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_SYSTEM_LAYER: ${{ matrix.system-layer }}
      npm_config_cache: ~/.npm
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v7

      - name: Verify runner platform
        run: |
          test "$(uname -m)" = "${{ matrix.host-architecture }}"
          case "${{ matrix.platform }}" in
            macos)
              test "$(uname -s)" = Darwin
              ;;
            windows)
              case "$(uname -s)" in
                MINGW*_NT-* | MSYS_NT-* | CYGWIN_NT-*) ;;
                *) exit 1 ;;
              esac
              ;;
            *) exit 1 ;;
          esac

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        working-directory: native

      - name: Restore reusable Cargo outputs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            native/target/debug/.fingerprint
            native/target/debug/build
            native/target/debug/deps
          key: cargo-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-${{ hashFiles('native/Cargo.lock', 'scripts/install-duckdb.sh', 'native/.cargo/config.toml') }}
          restore-keys: |
            cargo-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-

      - name: Restore provisioned dependencies
        uses: actions/cache@v6
        with:
          path: |
            native/.toolchain/node
            native/.duckdb
            ~/.npm
          key: provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-${{ hashFiles('native/desktop/package-lock.json') }}${{ matrix.provision-suffix }}
          restore-keys: |
            provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-

      - name: Verify native code
        run: scripts/run.sh check-native

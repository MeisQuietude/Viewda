# Distributable artifacts must be produced and launched on their target OS.
# Tags always build the complete release set. Maintainers can also select one
# installable target from any branch without exposing the updater signing key
# to code outside a trusted tag or scheduled rehearsal.
name: Platform builds
run-name: >-
  ${{ github.event_name == 'workflow_dispatch' &&
  format('{0} from {1}', inputs.platform, inputs.source_ref) ||
  github.event_name == 'schedule' &&
  format('Nightly rehearsal from {0}', github.ref_name) ||
  format('Release {0}', github.ref_name) }}

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string
      platform:
        description: Installable target to build from the selected branch
        required: true
        default: all
        type: choice
        options:
          - all
          - linux-x64
          - macos-arm64
          - macos-x64
          - macos-universal
          - windows-x64

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: >-
    platform-builds-${{ github.event_name == 'workflow_dispatch' &&
    inputs.source_ref || github.ref }}-${{
    github.event_name == 'workflow_dispatch' && inputs.platform || 'all' }}
  cancel-in-progress: true

env:
  TAURI_DRIVER_VERSION: 2.0.6
  # CI neither debugs Rust binaries nor reuses machine-local incremental
  # state. Omitting both makes cold compilation cheaper and saved dependency
  # caches smaller without changing debug assertions or release artifacts.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_CACHE_EPOCH: bundle-v1
  REQUIRE_UPDATER_ARTIFACTS: >-
    ${{ github.event_name == 'schedule' ||
    (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  source:
    name: Resolve source commit
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.nightly.outputs.build }}
      release: ${{ steps.source.outputs.release }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out the requested source
        uses: actions/checkout@v6
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch' &&
            inputs.source_ref || github.ref }}

      - name: Record the exact source commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip an unchanged nightly rehearsal
        id: nightly
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != schedule ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/platform-builds.yml/runs?branch=${GITHUB_REF_NAME}&event=schedule&status=success&per_page=1"
          if previous_sha=$(gh api "$runs_api" --jq '.workflow_runs[0].head_sha // empty'); then
            if [[ "$previous_sha" == "$SOURCE_SHA" ]]; then
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "Skipping: the latest successful nightly already tested $SOURCE_SHA."
              exit 0
            fi
          else
            echo "::warning::Could not inspect earlier nightly runs; building instead."
          fi

          echo "build=true" >> "$GITHUB_OUTPUT"

  release-checks:
    name: Verify the release source
    needs: source
    if: needs.source.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  linux:
    needs: [source, release-checks]
    if: >-
      always() &&
      needs.source.result == 'success' &&
      needs.source.outputs.build == 'true' &&
      (needs.source.outputs.release != 'true' ||
      needs.release-checks.result == 'success') &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'linux-x64')
    name: Linux x64 artifact
    # AppImage inherits its glibc floor from the build host. Ubuntu 22.04 is
    # the oldest supported GitHub runner with WebKitGTK 4.1, so using a newer
    # runner here would make the supposedly portable artifact less portable.
    runs-on: ubuntu-22.04
    env:
      CARGO_SYSTEM_LAYER: ubuntu-22.04
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: viewda-platform-v1
      TAURI_SIGNING_PRIVATE_KEY: >-
        ${{ github.event_name != 'workflow_dispatch' &&
        secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Require the updater signing key
        if: env.REQUIRE_UPDATER_ARTIFACTS == 'true'
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Install Tauri system dependencies
        run: |
          test "$(uname -m)" = x86_64
          scripts/install-tauri-deps.sh

      # Explicit install (reads native/rust-toolchain.toml): the rustup shim's
      # auto-install behavior has changed between rustup releases.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        working-directory: native

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Restore Cargo sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-sources-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-

      # These directories come from checksum/lockfile-verified installers.
      # Their guards still run inside scripts/run.sh setup after restoration.
      - name: Restore provisioned dependencies
        uses: actions/cache@v5
        with:
          path: |
            native/.toolchain/node
            native/.duckdb
            ~/.npm
          key: provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-${{ hashFiles('native/desktop/package-lock.json') }}
          restore-keys: |
            provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-

      - name: Prepare the artifact build
        run: scripts/run.sh setup

      - name: Build the Linux artifact
        run: scripts/run.sh bundle

      - name: Verify the Linux packages
        run: |
          . scripts/env.sh
          mapfile -d '' -t packages < <(
            find native/target/release/bundle/deb \
              -maxdepth 1 -type f -name '*.deb' -print0
          )
          test "${#packages[@]}" -eq 1
          package="${packages[0]}"
          expected_application_version=$(scripts/release.sh version)
          expected_package_version=$(
            scripts/release.sh debian-version "$expected_application_version"
          )
          test "$(dpkg-deb --field "$package" Package)" = viewda
          test "$(dpkg-deb --field "$package" Version)" \
            = "$expected_package_version"
          test "$(dpkg-deb --field "$package" Architecture)" = amd64
          test "$(basename "$package")" \
            = "Viewda_${expected_package_version}_amd64.deb"
          test "$(dpkg-deb --field "$package" Maintainer)" \
            = 'Stepan Savelyev <mail@meisquietude.com>'
          test "$(dpkg-deb --field "$package" Homepage)" \
            = 'https://github.com/MeisQuietude/Viewda'
          test "$(dpkg-deb --field "$package" Section)" = devel
          dpkg-deb --field "$package" Description \
            | grep -Fx 'A free, offline Apache Parquet viewer.'
          dpkg-deb --field "$package" Description \
            | grep -F 'Open local Apache Parquet files to inspect file information and schema without uploading data.'
          readelf -d native/target/release/viewda \
            | grep -F '$ORIGIN/../lib/viewda'
          LD_LIBRARY_PATH="$DUCKDB_LIB_DIR" ldd native/target/release/viewda \
            | grep -F "$DUCKDB_LIB_DIR/libduckdb.so"
          dpkg-deb --contents "$package" \
            | grep -F 'usr/lib/viewda/libduckdb.so'
          dpkg-deb --contents "$package" \
            | grep -F 'usr/share/mime/packages/viewda.xml'
          extracted=$(mktemp -d)
          trap 'rm -rf "$extracted"' EXIT
          dpkg-deb --extract "$package" "$extracted"
          grep -Fx 'Categories=Development;' \
            "$extracted/usr/share/applications/Viewda.desktop"
          grep -Fx 'Exec=viewda %f' \
            "$extracted/usr/share/applications/Viewda.desktop"
          grep -Fx 'MimeType=application/vnd.apache.parquet' \
            "$extracted/usr/share/applications/Viewda.desktop"
          grep -F 'mime-type type="application/vnd.apache.parquet"' \
            "$extracted/usr/share/mime/packages/viewda.xml"
          # Resolution is checked with the dev environment stripped: the
          # installed package must stand on its own RUNPATH.
          resolved_library=$(
            env -u LD_LIBRARY_PATH ldd "$extracted/usr/bin/viewda" \
              | awk '$1 == "libduckdb.so" { print $3 }'
          )
          test "$(realpath "$resolved_library")" \
            = "$(realpath "$extracted/usr/lib/viewda/libduckdb.so")"
          package_size=$(stat --format='%s' "$package")
          test "$package_size" -lt "$((30 * 1000 * 1000))"
          stat --format='release binary: %s bytes' native/target/release/viewda
          stat --format='deb package: %s bytes' "$package"

          mapfile -d '' -t appimages < <(
            find native/target/release/bundle/appimage \
              -maxdepth 1 -type f -name '*.AppImage' -print0
          )
          test "${#appimages[@]}" -eq 1
          appimage="${appimages[0]}"
          test "$(basename "$appimage")" \
            = "Viewda_${expected_application_version}_amd64.AppImage"
          if [[ "$REQUIRE_UPDATER_ARTIFACTS" == true ]]; then
            test -s "${appimage}.sig"
          fi

          # Extract the actual update payload with the development library
          # path removed. This proves the AppImage carries its own DuckDB.
          appimage=$(realpath "$appimage")
          appimage_root=$(mktemp -d)
          (
            cd "$appimage_root"
            env -u LD_LIBRARY_PATH "$appimage" --appimage-extract >/dev/null
          )
          appimage_binary="$appimage_root/squashfs-root/usr/bin/viewda"
          appimage_library="$appimage_root/squashfs-root/usr/lib/libduckdb.so"
          test -x "$appimage_binary"
          test -f "$appimage_library"
          resolved_library=$(
            env -u LD_LIBRARY_PATH ldd "$appimage_binary" \
              | awk '$1 == "libduckdb.so" { print $3 }'
          )
          test "$(realpath "$resolved_library")" \
            = "$(realpath "$appimage_library")"
          stat --format='AppImage: %s bytes' "$appimage"
          if [[ "$REQUIRE_UPDATER_ARTIFACTS" == true ]]; then
            stat --format='AppImage updater signature: %s bytes' \
              "${appimage}.sig"
          fi

          # Stage flat files so each Actions artifact exposes one directly
          # installable format. The signature is uploaded separately for tags.
          rm -rf artifacts
          mkdir artifacts
          cp "$package" "$appimage" artifacts/
          if [[ "$REQUIRE_UPDATER_ARTIFACTS" == true ]]; then
            cp "${appimage}.sig" artifacts/
          fi

      - name: Upload the Linux Debian artifact
        uses: actions/upload-artifact@v7
        with:
          name: viewda-linux-x64-deb-${{ needs.source.outputs.sha }}
          path: artifacts/*.deb
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Linux AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: viewda-linux-x64-appimage-${{ needs.source.outputs.sha }}
          path: artifacts/*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Linux updater signature
        if: needs.source.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: viewda-updater-linux-x64-${{ needs.source.outputs.sha }}
          path: artifacts/*.AppImage.sig
          if-no-files-found: error
          retention-days: 7

  macos:
    needs: [source, release-checks]
    if: >-
      always() &&
      needs.source.result == 'success' &&
      needs.source.outputs.build == 'true' &&
      (needs.source.outputs.release != 'true' ||
      needs.release-checks.result == 'success') &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      startsWith(inputs.platform, 'macos-'))
    # Pinned to the OS generation real users run: dyld and signing policy
    # tighten across macOS generations, so a launch gate on an older
    # runner accepts bundles a newer macOS refuses.
    name: macOS ${{ matrix.artifact-architecture }} artifact
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            host-architecture: arm64
            artifact-architecture: arm64
            dmg-architecture: aarch64
          - runner: macos-26-intel
            host-architecture: x86_64
            artifact-architecture: x64
            dmg-architecture: x64
    runs-on: ${{ matrix.runner }}
    env:
      BUILD_SELECTED: >-
        ${{ github.event_name != 'workflow_dispatch' ||
        inputs.platform == 'all' ||
        inputs.platform == 'macos-universal' ||
        inputs.platform == format('macos-{0}', matrix.artifact-architecture) }}
      CARGO_SYSTEM_LAYER: ${{ matrix.runner }}
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: viewda-platform-v1
      TAURI_SIGNING_PRIVATE_KEY: >-
        ${{ github.event_name != 'workflow_dispatch' &&
        secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - name: Check out the tested commit
        if: env.BUILD_SELECTED == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Require the updater signing key
        if: >-
          env.BUILD_SELECTED == 'true' &&
          env.REQUIRE_UPDATER_ARTIFACTS == 'true'
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Install the pinned Rust toolchain
        if: env.BUILD_SELECTED == 'true'
        run: rustup toolchain install
        working-directory: native

      - name: Install sccache
        if: env.BUILD_SELECTED == 'true'
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Restore Cargo sources
        if: env.BUILD_SELECTED == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-sources-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-

      - name: Restore provisioned dependencies
        if: env.BUILD_SELECTED == 'true'
        uses: actions/cache@v5
        with:
          path: |
            native/.toolchain/node
            native/.duckdb
            ~/.npm
          key: provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-${{ hashFiles('native/desktop/package-lock.json') }}
          restore-keys: |
            provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-

      - name: Verify runner architecture
        if: env.BUILD_SELECTED == 'true'
        run: test "$(uname -m)" = "${{ matrix.host-architecture }}"

      - name: Prepare the artifact build
        if: env.BUILD_SELECTED == 'true'
        run: scripts/run.sh setup

      - name: Build the macOS ${{ matrix.artifact-architecture }} artifact
        if: env.BUILD_SELECTED == 'true'
        run: scripts/run.sh bundle

      - name: Verify packaged DuckDB
        if: env.BUILD_SELECTED == 'true'
        run: |
          app=native/target/release/bundle/macos/Viewda.app
          executable="$app/Contents/MacOS/viewda"
          library="$app/Contents/Frameworks/libduckdb.dylib"
          plist="$app/Contents/Info.plist"
          test -f "$library"
          test "$(
            lipo -archs "$library"
          )" = "${{ matrix.host-architecture }}"
          otool -L "$executable" \
            | grep -F 'libduckdb.dylib'
          otool -l "$executable" \
            | grep -A2 LC_RPATH \
            | grep -F '@loader_path/../Frameworks'
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleDocumentTypes.0.CFBundleTypeRole raw "$plist")" = Viewer
          test "$(plutil -extract CFBundleDocumentTypes.0.LSHandlerRank raw "$plist")" = Alternate
          test "$(plutil -extract CFBundleDocumentTypes.0.CFBundleTypeExtensions.0 raw "$plist")" = parquet
          test "$(plutil -extract CFBundleDocumentTypes.0.LSItemContentTypes.0 raw "$plist")" \
            = io.github.meisquietude.viewda.parquet
          test "$(plutil -extract UTExportedTypeDeclarations.0.UTTypeIdentifier raw "$plist")" \
            = io.github.meisquietude.viewda.parquet
          test "$(/usr/libexec/PlistBuddy -c 'Print :UTExportedTypeDeclarations:0:UTTypeTagSpecification:public.mime-type' "$plist")" \
            = application/vnd.apache.parquet

          # Comparing these fields catches a regression to the upstream
          # vendor signature. Equal `TeamIdentifier=not set` values do not
          # establish a shared Team ID; the signed entitlement and launch
          # probe below cover that macOS 26 runtime requirement.
          signing_field() {
            codesign --display --verbose=4 "$1" 2>&1 \
              | awk -F= -v field="$2" '$1 == field { print $2 }'
          }
          executable_team=$(signing_field "$executable" TeamIdentifier)
          library_team=$(signing_field "$library" TeamIdentifier)
          executable_signature=$(signing_field "$executable" Signature)
          library_signature=$(signing_field "$library" Signature)
          test -n "$executable_team"
          test "$library_team" = "$executable_team"
          test "$library_team" = 'not set'
          test "$executable_signature" = adhoc
          test "$library_signature" = adhoc

          # Matching ad hoc fields are still not a shared Team ID: macOS 26
          # rejects the pair unless the app disables library validation. The
          # entitlement is read from the actual signature — not the source
          # plist — so a future signing refactor cannot silently drop it.
          entitlements=$(codesign --display --entitlements - "$executable" 2>/dev/null)
          printf '%s\n' "$entitlements"
          printf '%s\n' "$entitlements" \
            | grep -F -A2 '[Key] com.apple.security.cs.disable-library-validation' \
            | grep -F '[Bool] true'

          echo "application Signature: $executable_signature"
          echo "application TeamIdentifier: $executable_team"
          echo "DuckDB Signature: $library_signature"
          echo "DuckDB TeamIdentifier: $library_team"
          echo "disable-library-validation: true"
          du -sh "$app"

      # tauri-driver has no macOS backend. Mounting the actual DMG and launching
      # its application still catches the whole died-before-main class: dyld,
      # signatures and rpath. DYLD_FALLBACK_LIBRARY_PATH is stripped so the dev
      # copy in native/.duckdb cannot satisfy dyld and mask a broken installer.
      - name: Verify and launch the DMG installer
        if: env.BUILD_SELECTED == 'true'
        run: |
          version=$(scripts/release.sh version)
          source_dmg="native/target/release/bundle/dmg/Viewda_${version}_${{ matrix.dmg-architecture }}.dmg"
          test -f "$source_dmg"

          mkdir -p artifacts
          artifact="artifacts/Viewda_${version}_${{ matrix.artifact-architecture }}.dmg"
          cp "$source_dmg" "$artifact"

          if [[ "$REQUIRE_UPDATER_ARTIFACTS" == true ]]; then
            source_updater="native/target/release/bundle/macos/Viewda.app.tar.gz"
            updater="artifacts/Viewda_${version}_${{ matrix.artifact-architecture }}.app.tar.gz"
            test -f "$source_updater"
            test -s "${source_updater}.sig"
            cp "$source_updater" "$updater"
            cp "${source_updater}.sig" "${updater}.sig"
          fi

          artifact_size=$(stat -f '%z' "$artifact")
          test "$artifact_size" -lt "$((30 * 1000 * 1000))"
          echo "macOS ${{ matrix.artifact-architecture }} DMG: ${artifact_size} bytes"
          if [[ "$REQUIRE_UPDATER_ARTIFACTS" == true ]]; then
            stat -f 'macOS updater: %z bytes' "$updater"
            stat -f 'macOS updater signature: %z bytes' "${updater}.sig"
          fi

          mount_point=
          pid=
          cleanup() {
            if [[ -n "$pid" ]]; then
              kill "$pid" 2>/dev/null || true
            fi
            if [[ -n "$mount_point" ]]; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          attach_output=$(
            hdiutil attach -readonly -nobrowse -noautoopen "$artifact"
          )
          mount_point=$(
            printf '%s\n' "$attach_output" \
              | awk -F '\t' '$3 ~ /^\// { print $3; exit }'
          )
          test -d "$mount_point/Viewda.app"
          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = /Applications

          mounted_app="$mount_point/Viewda.app"
          executable="$mounted_app/Contents/MacOS/viewda"
          library="$mounted_app/Contents/Frameworks/libduckdb.dylib"
          test "$(lipo -archs "$executable")" = "${{ matrix.host-architecture }}"
          test "$(lipo -archs "$library")" = "${{ matrix.host-architecture }}"
          codesign --verify --deep --strict "$mounted_app"

          log="$RUNNER_TEMP/viewda-launch.log"
          env -u DYLD_FALLBACK_LIBRARY_PATH "$executable" >"$log" 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            cat "$log"
            exit 1
          fi
          kill "$pid"
          wait "$pid" || test "$?" -eq 143
          pid=
          hdiutil detach "$mount_point" >/dev/null
          mount_point=
          trap - EXIT

      - name: Upload the macOS ${{ matrix.artifact-architecture }} artifact
        if: env.BUILD_SELECTED == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: viewda-macos-${{ matrix.artifact-architecture }}-${{ needs.source.outputs.sha }}
          path: artifacts/*.dmg
          if-no-files-found: error
          retention-days: 7

      - name: Upload the macOS ${{ matrix.artifact-architecture }} updater
        if: >-
          env.BUILD_SELECTED == 'true' &&
          needs.source.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: viewda-updater-macos-${{ matrix.artifact-architecture }}-${{ needs.source.outputs.sha }}
          path: |
            artifacts/*.app.tar.gz
            artifacts/*.app.tar.gz.sig
          if-no-files-found: error
          retention-days: 7

  macos-universal:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'macos-universal'
    name: macOS Universal derived artifact
    needs: [source, macos]
    runs-on: macos-26
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      # Compose only artifacts from this workflow run. Both input applications
      # have already passed their native launch probe on the matching CPU.
      - name: Download the Apple silicon artifact
        uses: actions/download-artifact@v8
        with:
          name: viewda-macos-arm64-${{ needs.source.outputs.sha }}
          path: artifacts/arm64

      - name: Download the Intel artifact
        uses: actions/download-artifact@v8
        with:
          name: viewda-macos-x64-${{ needs.source.outputs.sha }}
          path: artifacts/x64

      - name: Compose the Universal application
        run: |
          shopt -s nullglob
          arm_dmgs=(artifacts/arm64/*.dmg)
          intel_dmgs=(artifacts/x64/*.dmg)
          test "${#arm_dmgs[@]}" -eq 1
          test "${#intel_dmgs[@]}" -eq 1

          extract_application() {
            local dmg=$1
            local output=$2
            local attach_output
            local mount_point

            attach_output=$(
              hdiutil attach -readonly -nobrowse -noautoopen "$dmg"
            )
            mount_point=$(
              printf '%s\n' "$attach_output" \
                | awk -F '\t' '$3 ~ /^\// { print $3; exit }'
            )
            test -d "$mount_point/Viewda.app"
            if ! ditto "$mount_point/Viewda.app" "$output"; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
              return 1
            fi
            hdiutil detach "$mount_point" >/dev/null
          }

          extract_application "${arm_dmgs[0]}" artifacts/arm64/Viewda.app
          extract_application "${intel_dmgs[0]}" artifacts/x64/Viewda.app
          scripts/create-macos-universal.sh \
            artifacts/arm64/Viewda.app \
            artifacts/x64/Viewda.app \
            artifacts/universal/Viewda.app

      - name: Verify the Universal application
        run: |
          app=artifacts/universal/Viewda.app
          executable="$app/Contents/MacOS/viewda"
          library="$app/Contents/Frameworks/libduckdb.dylib"
          lipo "$executable" -verify_arch arm64 x86_64
          lipo "$library" -verify_arch arm64 x86_64
          otool -l "$executable" \
            | grep -A2 LC_RPATH \
            | grep -F '@loader_path/../Frameworks'
          codesign --verify --deep --strict "$app"

          signing_field() {
            codesign --display --verbose=4 --arch "$2" "$1" 2>&1 \
              | awk -F= -v field="$3" '$1 == field { print $2 }'
          }
          for architecture in arm64 x86_64; do
            executable_team=$(signing_field "$executable" "$architecture" TeamIdentifier)
            library_team=$(signing_field "$library" "$architecture" TeamIdentifier)
            executable_signature=$(signing_field "$executable" "$architecture" Signature)
            library_signature=$(signing_field "$library" "$architecture" Signature)

            echo "$architecture application Signature: $executable_signature"
            echo "$architecture application TeamIdentifier: $executable_team"
            echo "$architecture DuckDB Signature: $library_signature"
            echo "$architecture DuckDB TeamIdentifier: $library_team"
            test "$executable_team" = 'not set'
            test "$library_team" = "$executable_team"
            test "$executable_signature" = adhoc
            test "$library_signature" = "$executable_signature"

            entitlements=$(
              codesign --display --entitlements - --arch "$architecture" \
                "$executable" 2>/dev/null
            )
            printf '%s\n' "$entitlements" \
              | grep -F -A2 '[Key] com.apple.security.cs.disable-library-validation' \
              | grep -F '[Bool] true'
          done

      - name: Create and launch the Universal DMG installer
        run: |
          shopt -s nullglob
          templates=(artifacts/arm64/*.dmg)
          test "${#templates[@]}" -eq 1

          app=artifacts/universal/Viewda.app
          version=$(
            plutil -extract CFBundleShortVersionString raw \
              "$app/Contents/Info.plist"
          )
          artifact="artifacts/Viewda_${version}_universal.dmg"
          scripts/create-macos-universal-dmg.sh \
            "${templates[0]}" \
            "$app" \
            "$artifact"

          artifact_size=$(stat -f '%z' "$artifact")
          # The convenience installer contains both native slices; the 30 MB
          # single-architecture budget does not apply to it.
          test "$artifact_size" -lt "$((50 * 1000 * 1000))"
          echo "macOS Universal DMG: ${artifact_size} bytes"

          mount_point=
          pid=
          cleanup() {
            if [[ -n "$pid" ]]; then
              kill "$pid" 2>/dev/null || true
            fi
            if [[ -n "$mount_point" ]]; then
              hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT

          attach_output=$(
            hdiutil attach -readonly -nobrowse -noautoopen "$artifact"
          )
          mount_point=$(
            printf '%s\n' "$attach_output" \
              | awk -F '\t' '$3 ~ /^\// { print $3; exit }'
          )
          test -d "$mount_point/Viewda.app"
          test -L "$mount_point/Applications"
          test "$(readlink "$mount_point/Applications")" = /Applications

          mounted_app="$mount_point/Viewda.app"
          executable="$mounted_app/Contents/MacOS/viewda"
          library="$mounted_app/Contents/Frameworks/libduckdb.dylib"
          lipo "$executable" -verify_arch arm64 x86_64
          lipo "$library" -verify_arch arm64 x86_64
          codesign --verify --deep --strict "$mounted_app"

          log="$RUNNER_TEMP/viewda-universal-launch.log"
          env -u DYLD_FALLBACK_LIBRARY_PATH "$executable" >"$log" 2>&1 &
          pid=$!
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            wait "$pid" || true
            cat "$log"
            exit 1
          fi
          kill "$pid"
          wait "$pid" || test "$?" -eq 143
          pid=
          hdiutil detach "$mount_point" >/dev/null
          mount_point=
          trap - EXIT

      - name: Upload the macOS Universal artifact
        uses: actions/upload-artifact@v7
        with:
          name: viewda-macos-universal-${{ needs.source.outputs.sha }}
          path: artifacts/Viewda_*_universal.dmg
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: [source, release-checks]
    if: >-
      always() &&
      needs.source.result == 'success' &&
      needs.source.outputs.build == 'true' &&
      (needs.source.outputs.release != 'true' ||
      needs.release-checks.result == 'success') &&
      (github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows-x64')
    name: Windows x64 installer
    runs-on: windows-2025
    env:
      CARGO_SYSTEM_LAYER: windows-2025
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      SCCACHE_GHA_VERSION: viewda-platform-v1
      # npm otherwise uses %LocalAppData%\npm-cache on Windows, outside the
      # provision cache shared with the other native jobs.
      npm_config_cache: ~/.npm
      TAURI_SIGNING_PRIVATE_KEY: >-
        ${{ github.event_name != 'workflow_dispatch' &&
        secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Require the updater signing key
        if: env.REQUIRE_UPDATER_ARTIFACTS == 'true'
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Verify runner architecture
        run: |
          test "$(uname -m)" = x86_64
          case "$(uname -s)" in
            MINGW*_NT-* | MSYS_NT-* | CYGWIN_NT-*) ;;
            *) exit 1 ;;
          esac

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        working-directory: native

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.17.0

      - name: Restore Cargo sources
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/git/db
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
          key: cargo-sources-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-${{ hashFiles('native/Cargo.lock') }}
          restore-keys: |
            cargo-sources-${{ env.CARGO_CACHE_EPOCH }}-${{ env.CARGO_SYSTEM_LAYER }}-${{ runner.arch }}-${{ hashFiles('native/rust-toolchain.toml') }}-

      - name: Restore provisioned dependencies
        uses: actions/cache@v5
        with:
          path: |
            native/.toolchain/node
            native/.duckdb
            ~/.npm
          # The suffix invalidates the former Windows cache whose ~/.npm path
          # was empty because npm used %LocalAppData%\npm-cache.
          key: provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-${{ hashFiles('native/desktop/package-lock.json') }}-npm-home-v1
          restore-keys: |
            provision-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.node-version', 'scripts/install-node.sh', 'scripts/install-duckdb.sh') }}-

      - name: Prepare the artifact build
        run: scripts/run.sh setup

      - name: Build the Windows installer
        run: scripts/run.sh bundle

      # The silent install proves the published NSIS executable carries the
      # DLL and starts without the development PATH. Signing is intentionally
      # deferred, so an unexpected signature is treated as policy drift too.
      - name: Install and launch the packaged application
        shell: pwsh
        run: |
          $installers = @(
            Get-ChildItem "native/target/release/bundle/nsis/*.exe"
          )
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, got $($installers.Count)."
          }
          $installer = $installers[0]
          $version = bash scripts/release.sh version
          $expectedName = "Viewda_${version}_x64-setup.exe"
          if ($installer.Name -ne $expectedName) {
            throw "Expected $expectedName, got $($installer.Name)."
          }
          if ($env:REQUIRE_UPDATER_ARTIFACTS -eq "true") {
            if (!(Test-Path "$($installer.FullName).sig")) {
              throw "The updater signature is missing."
            }
            if ((Get-Item "$($installer.FullName).sig").Length -eq 0) {
              throw "The updater signature is empty."
            }
          }

          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "NotSigned") {
            throw "Expected an unsigned installer, got $($signature.Status)."
          }

          $parquetKey = "HKCU:\Software\Classes\.parquet"
          New-Item -Path $parquetKey -Force | Out-Null
          Set-Item -Path $parquetKey -Value "Existing.Parquet"

          $installDir = Join-Path $env:RUNNER_TEMP "viewda-installed"
          $install = Start-Process `
            -FilePath $installer.FullName `
            -ArgumentList "/S", "/D=$installDir" `
            -PassThru `
            -Wait
          if ($install.ExitCode -ne 0) {
            throw "NSIS exited with code $($install.ExitCode)."
          }
          if ((Get-Item $parquetKey).GetValue("") -ne "Existing.Parquet") {
            throw "The installer replaced the existing .parquet default."
          }
          $openWith = Get-Item "$parquetKey\OpenWithProgids"
          if ($openWith.GetValueNames() -notcontains "Viewda.Parquet") {
            throw "Viewda was not registered as an Open With handler."
          }

          $executable = Join-Path $installDir "viewda.exe"
          $openCommand = (Get-Item "HKCU:\Software\Classes\Viewda.Parquet\shell\open\command").GetValue("")
          $expectedOpenCommand = "`"$executable`" `"%1`""
          if ($openCommand -ne $expectedOpenCommand) {
            throw "Unexpected .parquet open command: $openCommand"
          }
          $library = Join-Path $installDir "duckdb.dll"
          if (!(Test-Path $executable)) {
            throw "The installed Viewda executable is missing."
          }
          if (!(Test-Path $library)) {
            throw "The installed DuckDB DLL is missing."
          }

          $bytes = [IO.File]::ReadAllBytes($executable)
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          $peSignature = [BitConverter]::ToUInt32($bytes, $peOffset)
          if ($peSignature -ne 0x00004550) {
            throw "The installed executable has no valid PE signature."
          }
          $optionalHeaderOffset = $peOffset + 24
          $subsystem = [BitConverter]::ToUInt16(
            $bytes,
            $optionalHeaderOffset + 68
          )
          if ($subsystem -ne 2) {
            throw "Expected Windows GUI subsystem 2, got $subsystem."
          }

          $stdout = Join-Path $env:RUNNER_TEMP "viewda-windows-stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "viewda-windows-stderr.log"
          $application = Start-Process `
            -FilePath $executable `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -PassThru
          Start-Sleep -Seconds 5
          if ($application.HasExited) {
            Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
            throw "The installed application exited before the launch gate."
          }
          Stop-Process -Id $application.Id

          $size = $installer.Length
          if ($size -ge 30MB) {
            throw "The Windows installer exceeds 30 MB: $size bytes."
          }
          Write-Host "installer Authenticode status: $($signature.Status)"
          Write-Host "application PE subsystem: $subsystem (Windows GUI)"
          Write-Host "NSIS installer: $size bytes"
          if ($env:REQUIRE_UPDATER_ARTIFACTS -eq "true") {
            $updaterSignatureSize = (Get-Item "$($installer.FullName).sig").Length
            Write-Host "updater signature: $updaterSignatureSize bytes"
          }

      - name: Upload the Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: viewda-windows-x64-${{ needs.source.outputs.sha }}
          path: native/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Upload the Windows updater signature
        if: needs.source.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: viewda-updater-windows-x64-${{ needs.source.outputs.sha }}
          path: native/target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error
          retention-days: 7

  linux-e2e:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      inputs.platform == 'all' ||
      inputs.platform == 'linux-x64'
    name: Linux downloaded-artifact smoke
    needs: [source, linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.sha }}

      - name: Install the Linux WebDriver runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes webkit2gtk-driver xvfb

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
        working-directory: native

      - name: Restore tauri-driver
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-${{ runner.os }}-${{ runner.arch }}-${{ env.TAURI_DRIVER_VERSION }}

      - name: Install tauri-driver
        # This deliberately runs from the repository root, so the standalone
        # CI tool does not inherit Viewda's native/.cargo linker flags.
        run: |
          if [[ ! -x "$HOME/.cargo/bin/tauri-driver" ]]; then
            cargo install tauri-driver --locked --version "$TAURI_DRIVER_VERSION"
          fi

      # Always this very run, never "latest successful": a cross-run
      # download can test a different commit than the one that built it.
      - name: Download the Debian artifact from this workflow run
        uses: actions/download-artifact@v8
        with:
          name: viewda-linux-x64-deb-${{ needs.source.outputs.sha }}
          path: artifacts

      - name: Download the AppImage artifact from this workflow run
        uses: actions/download-artifact@v8
        with:
          name: viewda-linux-x64-appimage-${{ needs.source.outputs.sha }}
          path: artifacts

      - name: Install the tested package
        run: |
          mapfile -d '' -t packages < <(
            find artifacts -maxdepth 1 -type f -name '*.deb' -print0
          )
          test "${#packages[@]}" -eq 1
          package=$(realpath "${packages[0]}")
          sudo apt-get install --yes "$package"
          test "$(dpkg-query --show --showformat='${Status}' viewda)" \
            = 'install ok installed'

      - name: Launch and inspect the downloaded artifact
        env:
          TAURI_WEBVIEW_AUTOMATION: "true"
          VIEWDA_BINARY: /usr/bin/viewda
        run: |
          # This artifact test intentionally does not source scripts/env.sh.
          # The system-installed package must resolve its own bundled DuckDB.
          scripts/install-node.sh
          PATH="$GITHUB_WORKSPACE/native/.toolchain/node/bin:$PATH" \
            xvfb-run --auto-servernum npm run test:e2e --prefix native/desktop

      - name: Launch the downloaded AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          TAURI_WEBVIEW_AUTOMATION: "true"
        run: |
          mapfile -d '' -t appimages < <(
            find artifacts -maxdepth 1 -type f -name '*.AppImage' -print0
          )
          test "${#appimages[@]}" -eq 1
          appimage=$(realpath "${appimages[0]}")
          chmod +x "$appimage"
          # Do not source scripts/env.sh: the downloaded artifact must not see
          # the development DuckDB copy. APPIMAGE stays set by the AppImage
          # runtime, so the application also exercises its self-update mode.
          scripts/install-node.sh
          VIEWDA_BINARY="$appimage" \
            PATH="$GITHUB_WORKSPACE/native/.toolchain/node/bin:$PATH" \
            xvfb-run --auto-servernum npm run test:e2e --prefix native/desktop

  release:
    name: Create draft release from version tag
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [source, linux, macos, macos-universal, windows, linux-e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # A release tag is an authenticated statement, not just a convenient
      # ref. Require an annotated GitHub-verified tag that resolves to this
      # exact workflow commit and is reachable from main.
      - name: Verify the signed tag and release metadata
        run: |
          git fetch origin main
          tested_commit=$(git rev-parse HEAD)
          git merge-base --is-ancestor "$tested_commit" origin/main

          tag_ref=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}"
          )
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object_sha=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_object=$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object_sha}"
          )
          test "$(jq -r '.object.type' <<<"$tag_object")" = commit
          test "$(jq -r '.object.sha' <<<"$tag_object")" = "$tested_commit"
          test "$(jq -r '.verification.verified' <<<"$tag_object")" = true

          scripts/release.sh verify "$GITHUB_REF_NAME"
          scripts/release.sh notes \
            "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release-notes.md"

      # Tag-only updater companions and the directly installable artifacts are
      # merged without their Actions ZIP transport. Detached signatures remain
      # build inputs: their values are embedded in the updater manifest instead
      # of being exposed as separate release assets.
      - name: Download the verified release inputs
        uses: actions/download-artifact@v8
        with:
          pattern: viewda-*-${{ needs.source.outputs.sha }}
          path: release-assets
          merge-multiple: true

      - name: Verify the release inputs
        run: |
          version=${GITHUB_REF_NAME#v}
          debian_version=$(scripts/release.sh debian-version "$version")
          debian_asset="Viewda_${debian_version}_amd64.deb"
          release_deb="Viewda_${version}_amd64.deb"
          expected=(
            "$debian_asset"
            "Viewda_${version}_amd64.AppImage"
            "Viewda_${version}_amd64.AppImage.sig"
            "Viewda_${version}_arm64.dmg"
            "Viewda_${version}_arm64.app.tar.gz"
            "Viewda_${version}_arm64.app.tar.gz.sig"
            "Viewda_${version}_universal.dmg"
            "Viewda_${version}_x64.dmg"
            "Viewda_${version}_x64.app.tar.gz"
            "Viewda_${version}_x64.app.tar.gz.sig"
            "Viewda_${version}_x64-setup.exe"
            "Viewda_${version}_x64-setup.exe.sig"
          )
          mapfile -d '' -t actual < <(
            find release-assets -maxdepth 1 -type f -print0
          )
          test "${#actual[@]}" -eq "${#expected[@]}"
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
          done
          # Debian needs `~` inside the package for prerelease ordering, but
          # GitHub normalizes that character in asset names. Publish the
          # SemVer filename while preserving the verified package metadata.
          test ! -e "release-assets/$release_deb"
          mv "release-assets/$debian_asset" "release-assets/$release_deb"
          expected[0]="$release_deb"
          scripts/release.sh updater-manifest \
            "$version" \
            "$RUNNER_TEMP/release-notes.md" \
            release-assets \
            "release-assets/Viewda_${version}_updater.json"

      - name: Create the draft GitHub Release
        run: |
          version=${GITHUB_REF_NAME#v}
          expected=(
            "Viewda_${version}_amd64.deb"
            "Viewda_${version}_amd64.AppImage"
            "Viewda_${version}_arm64.dmg"
            "Viewda_${version}_arm64.app.tar.gz"
            "Viewda_${version}_universal.dmg"
            "Viewda_${version}_x64.dmg"
            "Viewda_${version}_x64.app.tar.gz"
            "Viewda_${version}_x64-setup.exe"
            "Viewda_${version}_updater.json"
          )
          assets=()
          for asset in "${expected[@]}"; do
            assets+=("release-assets/$asset")
          done
          flags=(
            --draft
            --verify-tag
            --title "Viewda ${version}"
            --notes-file "$RUNNER_TEMP/release-notes.md"
          )
          if [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create \
            "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            "${flags[@]}"
